<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
      width: 220px; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      padding: 12px; 
      margin: 0; 
      background-color: #f0f2f5;
    }
    .card {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h3 { 
      color: #075E54; 
      margin: 0 0 10px 0; 
      font-size: 15px;
    }
    .status-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e7f7ef;
      padding: 6px 10px;
      border-radius: 5px;
    }
    .status-text {
      font-size: 12px;
      color: #075E54;
      margin: 0;
    }
    .badge { 
      font-weight: bold; 
      color: #25D366; 
      font-size: 12px;
    }
    .info {
      font-size: 11px;
      color: #667781;
      margin: 10px 0 0 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>WhatsApp Mod Bot</h3>
    <div class="status-box">
      <p class="status-text">सिस्टम स्टेटस:</p>
      <span class="badge">सक्रिय (Active)</span>
    </div>
    <p class="info">यह बॉट व्हाट्सएप वेब पर चालू है और ग्रुप की चैट पर लगातार नजर रख रहा है।</p>
  </div>
</body>
</html>
